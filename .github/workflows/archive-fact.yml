name: Archive fact

on:
  workflow_run:
    workflows: ["Daily fact"]
    types: [completed]
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 06:30 IST, backup in case the trigger above is missed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  archive:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python archive_fact.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add archive ARCHIVE.md
          git diff --cached --quiet || git commit -m "🗂 archive: $(date -u +%F)"
          git pull --rebase origin main
          git push
